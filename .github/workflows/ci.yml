name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m venv .venv
          source .venv/bin/activate
          pip install -e '.[dev]'
      - name: pytest
        run: |
          source .venv/bin/activate
          pytest -q
      - name: knowledge form (no transcripts)
        run: |
          source .venv/bin/activate
          devmemory validate --json
          # soft gate on main repo: fail only on form failures (not unknown-section warns)
          # use scripts/validate-knowledge.sh for --strict locally
          devmemory validate
